name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag à republier manuellement (ex: v1.0.0-beta.1)'
        required: true
jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
      deployments: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Determine version info
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.ref || github.ref_name }}"
          $isBeta = $tag -match '-beta'
          $semver = $tag.TrimStart('v')
          $version = $semver -replace '-.*',''
          $fullVersion = "$version.0"
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "is_beta=$isBeta" >> $env:GITHUB_OUTPUT
          echo "semver=$semver" >> $env:GITHUB_OUTPUT
          echo "full_version=$fullVersion" >> $env:GITHUB_OUTPUT

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish win-x64
        run: >
          dotnet publish src/StarXelem/StarXelem.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:Version=${{ steps.version.outputs.semver }}
          -p:AssemblyVersion=${{ steps.version.outputs.full_version }}
          -p:FileVersion=${{ steps.version.outputs.full_version }}
          -p:InformationalVersion=${{ steps.version.outputs.semver }}
          -o out/publish

      # Le ZIP est créé avant l'ajout des fichiers propres au MSIX (manifest, assets, resources.pri).
      - name: Zip
        run: Compress-Archive -Path out/publish/* -DestinationPath out/StarXelem-${{ steps.version.outputs.tag }}-win-x64.zip

      - name: Copy manifest and assets
        shell: pwsh
        run: |
          [xml]$manifest = Get-Content -Path src/StarXelem/AppxManifest.xml -Raw
          $manifest.Package.Identity.Version = "${{ steps.version.outputs.full_version }}"
          $manifest.Save("$PWD/out/publish/AppxManifest.xml")
          Copy-Item -Recurse src/StarXelem/DeployAssets out/publish/Assets

      - name: Generate resources.pri
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $makepri = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makepri.exe" | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          & $makepri new /pr out/publish /cf src/StarXelem//priconfig.xml /mn out/publish/AppxManifest.xml /of out/publish/resources.pri /o

      - name: Package MSIX
        shell: pwsh
        run: |
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          & $makeappx pack /d out/publish /p out/StarXelem.msix
          
      - name: Sign MSIX (test cert)
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("test-cert.pfx", [Convert]::FromBase64String("${{ secrets.MSSTORE_TEST_CERT_PFX_BASE64 }}"))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          & $signtool sign /fd SHA256 /a /f test-cert.pfx /p "${{ secrets.MSSTORE_TEST_CERT_PASSWORD }}" out/StarXelem.msix

      - name: Install msstore CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://github.com/microsoft/msstore-cli/releases/download/v0.3.9/MSStoreCLI-win-x64.zip" -OutFile msstore.zip
          Expand-Archive -Path msstore.zip -DestinationPath msstore-cli
          echo "$PWD\msstore-cli" >> $env:GITHUB_PATH

      - name: Configure msstore credentials
        shell: pwsh
        run: |
          msstore reconfigure --tenantId ${{ secrets.AZURE_AD_TENANT_ID }} --sellerId ${{ secrets.SELLER_ID }} --clientId ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }} --clientSecret "${{ secrets.AZURE_AD_APPLICATION_SECRET }}"

      - name: Extract changelog section
        id: changelog
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ github.event.inputs.ref || github.ref_name }}"
          $version = $tag.TrimStart('v') -replace '-beta.*',''
          $content = Get-Content CHANGELOG.md -Raw
          if ($content -match "(?ms)^## \[$([regex]::Escape($version))\].*?(?=^## \[|\z)") {
            $section = $matches[0].Trim()
          } else {
            $section = "Voir CHANGELOG.md sur GitHub pour le detail des changements."
          }
          Set-Content -Path out/release-notes.md -Value $section -Encoding utf8
          "notes<<EOF" >> $env:GITHUB_OUTPUT
          $section >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT



      - name: Publish stable submission (draft only)
        if: steps.version.outputs.is_beta == 'False'
        run: msstore publish out/StarXelem.msix --appId ${{ secrets.MSSTORE_PRODUCT_ID }} --noCommit

      - name: Inject release notes (stable only)
        if: steps.version.outputs.is_beta == 'False'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $lines = msstore submission get ${{ secrets.MSSTORE_PRODUCT_ID }}
          $startIndex = ($lines | Select-String -Pattern '^\{$' | Select-Object -First 1).LineNumber - 1
          $jsonText = ($lines[$startIndex..($lines.Count - 1)]) -join "`n"
          $submission = $jsonText | ConvertFrom-Json
          $submission.Listings.'fr-fr'.BaseListing.ReleaseNotes = @"
          ${{ steps.changelog.outputs.notes }}
          "@
          $updated = $submission | ConvertTo-Json -Depth 20
          msstore submission updateMetadata ${{ secrets.MSSTORE_PRODUCT_ID }} $updated

      - name: Commit and publish
        if: steps.version.outputs.is_beta == 'False'
        run: msstore submission publish ${{ secrets.MSSTORE_PRODUCT_ID }}



      - name: Publish beta flight
        if: steps.version.outputs.is_beta == 'True'
        run: msstore publish out/StarXelem.msix --appId ${{ secrets.MSSTORE_PRODUCT_ID }} --flightId ${{ secrets.MSSTORE_FLIGHT_ID_BETA }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: StarXelem ${{ steps.version.outputs.tag }}
          files: |
            out/StarXelem.msix
            out/StarXelem-${{ steps.version.outputs.tag }}-win-x64.zip
          body_path: out/release-notes.md
          generate_release_notes: true
          draft: false
          tag_name: ${{ steps.version.outputs.tag }}
          prerelease: ${{ steps.version.outputs.is_beta == 'True' }}
