name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag à republier manuellement (ex: v1.0.0-beta.1)'
        required: true
jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
      deployments: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Determine version info
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.ref || github.ref_name }}"
          $isBeta = $tag -match '-beta'
          $version = $tag.TrimStart('v') -replace '-beta.*',''
          $fullVersion = "$version.0"
          echo "is_beta=$isBeta" >> $env:GITHUB_OUTPUT
          echo "full_version=$fullVersion" >> $env:GITHUB_OUTPUT

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: dotnet publish src/StarXelem/StarXelem.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o out/publish

      - name: Copy manifest and assets
        shell: pwsh
        run: |
          [xml]$manifest = Get-Content -Path src/StarXelem/AppxManifest.xml -Raw
          $manifest.Package.Identity.Version = "${{ steps.version.outputs.full_version }}"
          $manifest.Save("$PWD/out/publish/AppxManifest.xml")
          Copy-Item -Recurse src/StarXelem/DeployAssets out/publish/Assets

      - name: Package MSIX
        shell: pwsh
        run: |
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          & $makeappx pack /d out/publish /p out/StarXelem.msix
  
      - name: Sign MSIX (test cert)
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("test-cert.pfx", [Convert]::FromBase64String("${{ secrets.MSSTORE_TEST_CERT_PFX_BASE64 }}"))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          & $signtool sign /fd SHA256 /a /f test-cert.pfx /p "${{ secrets.MSSTORE_TEST_CERT_PASSWORD }}" out/StarXelem.msix

      - name: Install msstore CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://github.com/microsoft/msstore-cli/releases/latest/download/MSStoreCLI-win-x64.zip" -OutFile msstore.zip
          Expand-Archive -Path msstore.zip -DestinationPath msstore-cli
          echo "$PWD\msstore-cli" >> $env:GITHUB_PATH

      - name: Configure msstore credentials
        shell: pwsh
        run: |
          msstore reconfigure --tenantId ${{ secrets.AZURE_AD_TENANT_ID }} --sellerId ${{ secrets.SELLER_ID }} --clientId ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }} --clientSecret "${{ secrets.AZURE_AD_APPLICATION_SECRET }}"

      - name: Publish stable submission
        if: steps.version.outputs.is_beta == 'False'
        run: msstore publish out/StarXelem.msix --appId ${{ secrets.MSSTORE_PRODUCT_ID }}

      - name: Publish beta flight
        if: steps.version.outputs.is_beta == 'True'
        run: msstore publish out/StarXelem.msix --appId ${{ secrets.MSSTORE_PRODUCT_ID }} --flightId ${{ secrets.MSSTORE_FLIGHT_ID_BETA }}
        
      - name: Publish win-x64
        run: >
          dotnet publish src/StarXelem/StarXelem.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:ApplicationVersion=${{ github.ref_name }}
          -o publish/win-x64

      - name: Zip
        run: Compress-Archive -Path publish/win-x64/* -DestinationPath out/StarXelem-${{ github.ref_name }}-win-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: StarXelem ${{ github.ref_name }}
          files: |
            out/StarXelem.msix
            out/StarXelem-${{ github.ref_name }}-win-x64.zip
          generate_release_notes: true
          draft: false
          tag_name: ${{ github.event.inputs.ref || github.ref_name }}
          prerelease: ${{ steps.version.outputs.isBeta == 'True' }}
